name: Nightly capacity snapshot

# The dashboard reads a snapshot rather than calling QuickBooks Time on page
# load. This is what produces it. Streamlit Cloud can't do this itself - its
# filesystem is wiped whenever the app sleeps, so anything written there is
# gone by the next visitor.

on:
  schedule:
    # 09:00 UTC = 02:00 Pacific. Cron here is always UTC and does not shift
    # with daylight saving, so this drifts by an hour twice a year. That's
    # fine for a nightly job; it just needs to land before anyone opens the
    # dashboard in the morning.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # run it by hand from the Actions tab

concurrency:
  # Two overlapping runs would both write the same Drive file. Let the
  # running one finish rather than cancelling it part-way.
  group: capacity-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a 24-month pull is ~25 chunked requests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth

      - name: Build and upload the snapshot
        env:
          TSHEETS_ACCESS_TOKEN: ${{ secrets.TSHEETS_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python scripts/build_snapshot.py --months 24

      - name: Keep a copy on the run
        # If the Drive upload succeeds but the file looks wrong, this is how
        # you get at exactly what was generated without re-running the pull.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-snapshot
          path: .cache/capacity_snapshot.json
          retention-days: 7
          if-no-files-found: warn
